[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-mission"
dynamic = ["version"]
description = "Domain-driven mission planning for autonomous drone operations, powered by MAVLink-compatible workflows and dual-backend persistence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "tiferet>=2.0.0b1",
]

[project.optional-dependencies]
h5 = [
    "tiferet-h5>=0.1.0",
    "tables>=3.10.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.dynamic]
version = {attr = "tiferet_mission.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tiferet_mission*"]

[tool.pytest.ini_options]
testpaths = ["tiferet_mission"]
